<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yaşam karnesi</title>
<style>
__ORTAK_CSS__
  fieldset { border: 1px solid var(--cizgi); border-radius: 10px; margin: 0 0 12px; padding: 12px; }
  legend { font-weight: 600; padding: 0 4px; }
  .secenekler { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
  .secenekler label { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border: 1px solid var(--cizgi);
                      border-radius: 999px; cursor: pointer; background: var(--yuzey); }
  .secenekler input { accent-color: var(--vurgu); margin: 0; }
  .secenekler label:has(input:checked) { border-color: var(--vurgu); }
  .puan { font-size: 28px; font-weight: 700; }
  .seviye-iyi { color: var(--iyi); } .seviye-orta { color: var(--orta); } .seviye-gelişmeli { color: var(--gelismeli); }
</style>
</head>
<body>
<main>
  <section id="form-bolumu">
    <h1>Yaşam karnesi</h1>
    <p class="ikincil">Altı soru. Her birinde sana en yakın seçeneği işaretle. Cevapların saklanmaz.</p>
    <form id="form"></form>
    <p id="form-hata" class="hata" hidden></p>
    <div class="eylemler"><button id="gonder" type="submit" form="form" disabled>Karnemi çıkar</button></div>
  </section>
  <section id="sonuc-bolumu" hidden></section>
</main>
<script>
// Sorular sunucudaki SORULAR listesinden enjekte edilir; seçenek kodları sunucuyla aynıdır.
const SORULAR = __SORULAR__;
__ORTAK_JS__
const { istek, el } = TB;

// ---- Form ----
const form = document.getElementById("form");
const gonder = document.getElementById("gonder");
const ad = (anahtar, deger) => `${anahtar}__${deger}`;

for (const s of SORULAR) {
  const fs = document.createElement("fieldset");
  const lg = document.createElement("legend");
  lg.textContent = s.soru;
  fs.append(lg);
  const kutu = document.createElement("div");
  kutu.className = "secenekler";
  kutu.setAttribute("role", "radiogroup");
  for (const sec of s.secenekler) {
    const etiket = document.createElement("label");
    const girdi = document.createElement("input");
    girdi.type = "radio"; girdi.name = s.anahtar; girdi.value = sec.deger; girdi.id = ad(s.anahtar, sec.deger);
    etiket.append(girdi, document.createTextNode(sec.etiket));
    kutu.append(etiket);
  }
  fs.append(kutu);
  form.append(fs);
}
const cevaplar = () => Object.fromEntries(SORULAR.map((s) => [s.anahtar, form.elements[s.anahtar].value]).filter(([, d]) => d));
form.addEventListener("change", () => { gonder.disabled = Object.keys(cevaplar()).length < SORULAR.length; });

function formuDoldur(c) {
  for (const [anahtar, deger] of Object.entries(c)) {
    const girdi = document.getElementById(ad(anahtar, deger));
    if (girdi) girdi.checked = true;
  }
  form.dispatchEvent(new Event("change"));
}

form.addEventListener("submit", async (olay) => {
  olay.preventDefault();
  const hata = document.getElementById("form-hata");
  hata.hidden = true;
  gonder.disabled = true;
  gonder.textContent = "Hesaplanıyor…";
  try {
    const sonuc = await istek("tools/call", { name: "yasam_karnesi", arguments: { cevaplar: cevaplar() } });
    if (sonuc?.isError || !sonuc?.structuredContent?.karne) throw new Error("beklenmeyen yanıt");
    sonucuIsle(sonuc);
  } catch (e) {
    hata.textContent = "Karne hesaplanamadı. Soruları sohbette yanıtlayarak da devam edebilirsin.";
    hata.hidden = false;
  } finally {
    gonder.textContent = "Karnemi çıkar";
    gonder.disabled = false;
  }
});

// ---- Sonuç kartı ----
let sonVeri = null;
function sonucuIsle(sonuc) {
  const v = sonuc?.structuredContent;
  if (!v || !v.karne) return;  // Sorular döndüyse form görünür kalır.
  sonVeri = v;
  const b = document.getElementById("sonuc-bolumu");
  b.replaceChildren();
  b.append(el("h1", { textContent: "Karnen" }));
  b.append(el("div", { className: "kart" },
    el("div", { className: "puan", textContent: `${v.toplam_puan} / ${v.en_yuksek_puan}` }),
    el("table", {}, ...v.karne.map((k) => el("tr", {},
      el("td", { textContent: `${k.alan}: ${k.cevap}` }),
      el("td", { className: `seviye-${k.seviye}`, textContent: k.seviye }))))));
  if (v.hedefler.length) {
    b.append(el("h2", { textContent: "Hedefler" }));
    for (const h of v.hedefler) b.append(el("div", { className: "kart" },
      el("strong", { textContent: `${h.alan}: ${h.hedef}` }), el("p", { textContent: h.ilk_adim })));
  }
  if (v.guvenlik_uyarilari.length) {
    b.append(el("h2", { textContent: "Güvenlik" }));
    for (const g of v.guvenlik_uyarilari) b.append(el("div", { className: "kart guvenlik" },
      el("strong", { textContent: `${g.tetikleyici} → ${g.etken_madde}` }), el("p", { textContent: g.mesaj })));
  }
  if (v.takviye_baglantilari.length) {
    b.append(el("h2", { textContent: "İncelenebilecek kanıtlar" }));
    for (const t of v.takviye_baglantilari) b.append(el("div", { className: "kart" },
      el("strong", { textContent: `${t.tetikleyici} → ${t.etken_madde}` }), el("p", { textContent: t.mesaj })));
    b.append(el("p", { className: "ikincil", textContent: v.kopru_notu }));
  }
  b.append(TB.kaynaklar(v.kaynaklar));
  b.append(el("p", { className: "ikincil", textContent: `${v.uyari} ${v.esik_notu}` }));
  const sohbet = el("button", { className: "ikinci", type: "button", textContent: "Sonucu sohbette konuş" });
  sohbet.addEventListener("click", sohbeteGonder);
  const yeniden = el("button", { className: "ikinci", type: "button", textContent: "Cevapları değiştir" });
  yeniden.addEventListener("click", () => { b.hidden = true; document.getElementById("form-bolumu").hidden = false; });
  b.append(el("div", { className: "eylemler" }, sohbet, yeniden));
  document.getElementById("form-bolumu").hidden = true;
  b.hidden = false;
}

function sohbeteGonder() {
  if (!sonVeri) return;
  const satirlar = [`Yaşam karnem: ${sonVeri.toplam_puan}/${sonVeri.en_yuksek_puan}.`];
  if (sonVeri.hedefler.length) satirlar.push("Hedefler: " + sonVeri.hedefler.map((h) => h.alan).join(", ") + ".");
  const baglantilar = [...sonVeri.guvenlik_uyarilari, ...sonVeri.takviye_baglantilari].map((t) => t.etken_madde);
  if (baglantilar.length) satirlar.push("Karnede çıkan bağlantılar: " + [...new Set(baglantilar)].join(", ") + ".");
  satirlar.push("Bunları birlikte değerlendirebilir miyiz?");
  istek("ui/message", { role: "user", content: [{ type: "text", text: satirlar.join(" ") }] }).catch(() => {});
}

// ---- Başlatma ----
TB.baslat("takviye-bilimi-karne", { sonuc: sonucuIsle, girdi: (a) => formuDoldur(a.cevaplar || {}) });
</script>
</body>
</html>
