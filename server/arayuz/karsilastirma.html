<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ürün karşılaştırma</title>
<style>
__ORTAK_CSS__
  .tablo-kutu { overflow-x: auto; border: 1px solid var(--cizgi); border-radius: 10px; background: var(--yuzey); }
  .tablo-kutu table { min-width: 100%; font-size: 13px; }
  .tablo-kutu th, .tablo-kutu td { padding: 8px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--cizgi);
                                   white-space: normal; min-width: 120px; }
  .tablo-kutu td:last-child { text-align: left; white-space: normal; }
  .tablo-kutu th[scope="row"] { color: var(--ikincil); font-weight: 600; min-width: 96px; position: sticky; left: 0; background: var(--yuzey); }
  .tablo-kutu thead th { font-size: 13px; }
  .yok { color: var(--ikincil); }
</style>
</head>
<body>
<main>
  <section id="icerik"><p class="ikincil">Karşılaştırma yükleniyor…</p></section>
</main>
<script>
__ORTAK_JS__
const { el, rozet } = TB;

function hucre(icerik, ...ek) { return el("td", {}, icerik, ...ek); }

function ciz(sonuc) {
  const v = sonuc?.structuredContent;
  if (!v || !v.kisa_ozet) return;
  const b = document.getElementById("icerik");
  if (!v.urunler) {
    TB.doldur(b, el("h1", { textContent: "Ürün karşılaştırma" }), el("p", { textContent: v.kisa_ozet }), TB.kaynaklar(v.kaynaklar));
    return;
  }
  const u = v.urunler;
  const kriter = (ad, f) => el("tr", {}, el("th", { scope: "row", textContent: ad }), ...u.map((x) => hucre(...[].concat(f(x)))));
  const tablo = el("table", {},
    el("thead", {}, el("tr", {}, el("th", { textContent: "" }), ...u.map((x) => el("th", { textContent: x.ad })))),
    el("tbody", {},
      kriter("Sunum biçimi", (x) => x.sunum_bicimi),
      kriter("Tek ya da kombine", (x) => x.tek_ya_da_kombine),
      kriter("Yaş sınırı", (x) => [x.yas_siniri, x.yas_siniri_disinda ? el("div", {}, rozet("Yaş sınırı dışında", "uyari")) : ""]),
      kriter("Parti analizi", (x) => x.parti_analizi),
      kriter("Etiketteki kullanım", (x) => x.etiketteki_kullanim),
      kriter("Doğrulanamayan satır", (x) => x.dogrulanamayan_satir ? el("span", {}, rozet(`${x.dogrulanamayan_satir}`, "uyari")) : "yok"),
      ...v.etken_madde_karsilastirmasi.map((r) => el("tr", {}, el("th", { scope: "row", textContent: r.etken_madde }),
        ...r.urunler.map((h) => h ? hucre(h.etiketteki, h.dogrulanamadi ? el("div", {}, rozet("Doğrulanamadı", "uyari")) : "")
                                  : el("td", { className: "yok", textContent: "—" }))))));
  TB.doldur(b,
    el("h1", { textContent: "Ürün karşılaştırma" }),
    el("div", { className: "rozetler" }, rozet("Sıralama yok"), rozet("Öneri yok")),
    el("p", { textContent: v.kisa_ozet }),
    el("div", { className: "tablo-kutu" }, tablo),
    el("p", { className: "ikincil", textContent: v.siralama_olcutu }),
    el("details", {}, el("summary", { textContent: "Bileşimler" }),
      ...u.map((x) => el("div", { className: "kart" }, el("strong", { textContent: x.ad }), el("p", { className: "ikincil", textContent: x.bilesim }),
        TB.baglanti(x.urun_sayfasi, "Ürün sayfası")))),
    v.taninmayan_urunler?.length ? el("p", { className: "ikincil", textContent: `Tanınmayan: ${v.taninmayan_urunler.join(", ")}` }) : null,
    TB.kaynaklar(v.kaynaklar),
    el("p", { className: "ikincil", textContent: v.uyari }));
}

TB.baslat("takviye-bilimi-karsilastirma", { sonuc: ciz });
</script>
</body>
</html>
