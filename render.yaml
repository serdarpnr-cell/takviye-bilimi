# Render "Blueprint" tanımı: sunucuyu ücretsiz planda tek tıkla yayına alır.
services:
  - type: web
    name: takviye-bilimi
    runtime: python
    plan: free
    buildCommand: pip install "mcp[cli]>=1.26,<2"
    startCommand: python -m server
    envVars:
      - key: TB_HOST
        value: 0.0.0.0
      - key: PYTHON_VERSION
        value: 3.12.7
      # Deneme sunucusu: kurul onayı bekleyen (taslak) kanıt kartlarını "taslak" notuyla gösterir.
      # Yayın sunucusunda bu satır kaldırılır; o zaman yalnızca onaylı kartlar sunulur.
      - key: TB_TASLAK_GOSTER
        value: "1"
