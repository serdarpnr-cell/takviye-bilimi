[project]
name = "takviye-bilimi"
version = "0.3.0"
description = "Takviye Bilimi MCP sunucusu (prototip)"
requires-python = ">=3.10"
dependencies = ["mcp[cli]>=1.26,<2"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]
# Tetiklenme ölçümü (scripts/tetiklenme_olc.py) için; sunucu bu pakete ihtiyaç duymaz.
olcum = ["anthropic"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
